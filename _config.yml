title: "Jiwon Lee"
author: "Jiwon Lee"
description: "Jiwon Lee is the Frank H. T. Rhodes Postdoctoral Fellow at the Cornell Population Center, researching social stratification, demography, public opinion, immigration, and sociology of education."
lang: "en"
date_format: "%B %d, %Y"
google_analytics: "G-W9NRQWCHYK"

# Maximum "News" entries shown on the homepage. Entries beyond this
# count stay in _data/news.yml but are not rendered, so the page keeps a
# fixed length however long the list grows.
news_limit: 5

# Shown on the CV page when set, e.g. "March 2026". Leave blank to hide.
cv_updated: "August 2026"

# Used for schema.org structured data in the page head.
job_title: "Frank H. T. Rhodes Postdoctoral Fellow"
affiliation: "Cornell University"
affiliation_short: "Cornell Population Center"
location: "Ithaca, NY"
alumni_of: "Johns Hopkins University"

# Names rendered in bold in author lists on the research page.
author_self:
  - "Lee, Jiwon"
  - "Jiwon Lee"

# SEO and Open Graph
url: "https://jiwonlee.net"
image: "/assets/jl_image.jpg"
twitter:
  username: JiwonLee586
  card: summary

# Menu — accepts {file, title, url, icon}
navigation:
  - {file: "index.md",    title: About}
  - {file: "research.md", title: Research}
  - {file: "teaching.md", title: Teaching}
  - {file: "cv.md",       title: CV}

# Profile links in the rail, rendered as plain text.
external:
  - {title: Email,          url: "mailto:jiwon.lee@cornell.edu"}
  - {title: Google Scholar, url: "https://scholar.google.com/citations?user=nszIX_sAAAAJ&hl=en"}
  - {title: GitHub,         url: "https://github.com/lee-jiwon"}

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - UNLICENSE.txt
  - .claude

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
